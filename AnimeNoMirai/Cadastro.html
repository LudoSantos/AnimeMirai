<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Conta">
        <h1>Novo por aqui?</h1>
        <p>Crie uma nova conta</p>
        <form>
            <p>
                <label for="INome">Nome</label>
                <input type="text" name="Nome" id="INome">
            </p>
            <p>
                <label for="IEmail">Email</label>
                <input type="email" name="Email" id="IEmail">
            </p>
            <p>
                <label for="ISenha">Senha</label>
                <input type="password" name="Senha" id="ISenha">
            </p>
            <a class="cadastro" href="Login.html">Já tem uma senha?</a>
            <p>
                <input class="botao" type="submit" value="Criar uma nova conta">
            </p>
            <p>
                <input class="botao" type="reset" value="Resetar">
            </p>
        </form>
    </div>
</body>
</html>
